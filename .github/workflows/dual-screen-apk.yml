name: APK Dual Screen

# Compila la versión con modo libro para la LG Dual Screen y publica el APK como artefacto.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app
        # Sin telemetría (el Firebase del proyecto oficial no conoce este paquete) ni actualizador
        # (ofrecería instalar el Mihon oficial en lugar de esta versión).
        run: ./gradlew assembleRelease -Pdist=ci -PdualScreenId=true -Pinclude-telemetry=false -Penable-updater=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihon-dualscreen-apk
          path: app/build/outputs/apk/release/*.apk
